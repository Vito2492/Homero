# Builds Mansion for Windows, Linux and Android on every push to main, and
# publishes a release with the three packages when a tag v* is pushed.
# The packages hold the program, SDL2 and the snes9x libretro core: no game.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  SDL: 2.30.9
  SNES9X: fae2fea08f74180759ef540ee94259213f503480

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zip
      - name: SDL2 for MinGW
        run: curl -sSfL --retry 5 https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-devel-$SDL-mingw.tar.gz | tar xz
      - name: snes9x core
        run: |
          git clone -q https://github.com/libretro/snes9x.git && git -C snes9x checkout -q $SNES9X
          make -C snes9x/libretro -j4 platform=win CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
      - name: Build
        run: make windows SDL2_MINGW=SDL2-$SDL/x86_64-w64-mingw32
      - name: Package
        run: |
          out=Mansion-Windows
          mkdir -p $out/licenses
          cp Mansion.exe SDL2-$SDL/x86_64-w64-mingw32/bin/SDL2.dll snes9x/libretro/snes9x_libretro.dll $out/
          cp dist/LEEME.txt README.md $out/
          cp LICENSE $out/licenses/Mansion-LICENSE.txt
          cp SDL2-$SDL/LICENSE.txt $out/licenses/SDL2-LICENSE.txt 2>/dev/null || true
          cp snes9x/LICENSE $out/licenses/snes9x-LICENSE.txt
          zip -qr9 Mansion-Windows.zip $out
      - uses: actions/upload-artifact@v4
        with: { name: Mansion-Windows, path: Mansion-Windows.zip }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev patchelf
      - name: snes9x core
        run: |
          git clone -q https://github.com/libretro/snes9x.git && git -C snes9x checkout -q $SNES9X
          make -C snes9x/libretro -j4
      - name: Build
        run: |
          make
          patchelf --set-rpath '$ORIGIN/lib' mansion
      - name: Package
        run: |
          out=Mansion-Linux
          mkdir -p $out/lib $out/licenses
          cp mansion snes9x/libretro/snes9x_libretro.so $out/
          cp -L $(ldconfig -p | awk '/libSDL2-2.0.so.0 /{print $NF; exit}') $out/lib/
          cp dist/LEEME.txt README.md $out/
          cp LICENSE $out/licenses/Mansion-LICENSE.txt
          cp snes9x/LICENSE $out/licenses/snes9x-LICENSE.txt
          tar -czf Mansion-Linux.tar.gz $out
      - uses: actions/upload-artifact@v4
        with: { name: Mansion-Linux, path: Mansion-Linux.tar.gz }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: SDL2 sources
        run: curl -sSfL --retry 5 https://github.com/libsdl-org/SDL/releases/download/release-$SDL/SDL2-$SDL.tar.gz | tar xz
      - name: snes9x core for the phone
        run: |
          git clone -q https://github.com/libretro/snes9x.git && git -C snes9x checkout -q $SNES9X
          cd snes9x/libretro/jni && $ANDROID_NDK_HOME/ndk-build -j4 APP_ABI="arm64-v8a x86_64"
      - name: Prepare
        run: |
          sh tools/android-prepare.sh SDL2-$SDL snes9x/libretro/libs
          mkdir -p android/app/src/main/assets/licenses
          cp LICENSE android/app/src/main/assets/licenses/Mansion-LICENSE.txt
          cp snes9x/LICENSE android/app/src/main/assets/licenses/snes9x-LICENSE.txt
          cp SDL2-$SDL/LICENSE.txt android/app/src/main/assets/licenses/SDL2-LICENSE.txt
      - name: Build
        run: |
          ndk=$(sed -n 's/^Pkg.Revision *= *//p' $ANDROID_NDK_HOME/source.properties)
          v=${{ github.ref_name }}
          case $v in v[0-9]*) v=${v#v} ;; *) v=0.0 ;; esac
          cd android
          gradle --no-daemon assembleRelease -PndkVersion=$ndk -PversionCode=${{ github.run_number }} -PversionName=$v
          cp app/build/outputs/apk/release/app-release.apk ../Mansion-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: Mansion-Android, path: Mansion-Android.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mansion ${{ github.ref_name }}
          body: |
            Windows: descomprimí Mansion-Windows.zip, poné tu ROM "Addams Family, The (USA).sfc" al lado de Mansion.exe y abrilo.
            Linux: descomprimí Mansion-Linux.tar.gz, poné la ROM al lado y corré ./mansion.
            Android: instalá Mansion-Android.apk (hay que permitir apps de origen desconocido). La primera vez te pide elegir tu ROM.
            No incluye el juego: usá tu propia copia (versión USA).
          files: |
            Mansion-Windows.zip
            Mansion-Linux.tar.gz
            Mansion-Android.apk
